  <g><title>0. starting point: -O = superoptimizer rules + constant folding: −3.4%</title><circle class="hit" cx="56" cy="88.30022670791217" r="14"/><circle class="dot" cx="56" cy="88.30022670791217" r="5"/></g>
  <g><title>1. forward single-use temporaries (local.set/local.get pairs): −11.2%</title><circle class="hit" cx="135.25" cy="143.60480772176066" r="14"/><circle class="dot" cx="135.25" cy="143.60480772176066" r="5"/></g>
  <g><title>2. re-mine the superoptimizer on forwarded code (43 rules): −11.2%</title><circle class="hit" cx="214.5" cy="144.0463579880025" r="14"/><circle class="dot" cx="214.5" cy="144.0463579880025" r="5"/></g>
  <g><title>3. heap headroom under -O: grow at 1/4 full instead of 1/2: −20.0%</title><circle class="hit" cx="293.75" cy="206.80351969346606" r="14"/><circle class="dot" cx="293.75" cy="206.80351969346606" r="5"/></g>
  <g><title>4. inline the allocation fast path under -O: −22.5%</title><circle class="hit" cx="373" cy="224.29562259359986" r="14"/><circle class="dot" cx="373" cy="224.29562259359986" r="5"/></g>
  <g><title>5. elide frame zeroing for slots written before any GC point: −23.9%</title><circle class="hit" cx="452.25" cy="234.8345281482802" r="14"/><circle class="dot" cx="452.25" cy="234.8345281482802" r="5"/></g>
  <g><title>6. superoptimizer: re-mine rewritten code until a fixed point; constants generalized under K &gt;= 0 side conditions: −24.0%</title><circle class="hit" cx="531.5" cy="234.86152330571468" r="14"/><circle class="dot" cx="531.5" cy="234.86152330571468" r="5"/></g>
  <g><title>7. forward frame-slot loads between GC points: −25.2%</title><circle class="hit" cx="610.75" cy="243.59128177905737" r="14"/><circle class="dot" cx="610.75" cy="243.59128177905737" r="5"/></g>
  <g><title>8. self tail calls become loops (frame reused): −27.3%</title><circle class="hit" cx="690" cy="258.75646076338035" r="14"/><circle class="dot" cx="690" cy="258.75646076338035" r="5"/></g>
  <text class="value" x="702" y="262.75646076338035">−27.3%</text>
