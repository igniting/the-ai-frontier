name: pages

# Publishes the playground to GitHub Pages (source: GitHub Actions) from main.
# The compiler's tests must pass before anything is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test before publishing
        run: npm test
      - name: Assemble the static site
        run: |
          mkdir -p _site/fuzz _site/selfhost _site/superopt _site/bench _site/proofs
          cp index.html playground.html _site/
          cp -r playground story src examples docs _site/
          cp fuzz/generate.js fuzz/check.js _site/fuzz/
          cp selfhost/lumenc.lm _site/selfhost/
          cp superopt/sat.js superopt/rup.js superopt/bv.js superopt/synth.js superopt/show.js superopt/verify-core.js superopt/rules.json _site/superopt/
          cp bench/campaign-instructions.svg bench/campaign-time.svg bench/campaign-instructions-paper.svg bench/campaign-time-paper.svg _site/bench/
          cp proofs/sat.lm proofs/schur.lm proofs/schur-core.js _site/proofs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
