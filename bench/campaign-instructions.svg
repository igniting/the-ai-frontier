  <g><title>0. starting point: -O = superoptimizer rules + constant folding: −3.4%</title><circle class="hit" cx="56" cy="84.828765749639" r="14"/><circle class="dot" cx="56" cy="84.828765749639" r="5"/></g>
  <g><title>1. forward single-use temporaries (local.set/local.get pairs): −11.2%</title><circle class="hit" cx="126.44444444444444" cy="132.2326923329377" r="14"/><circle class="dot" cx="126.44444444444444" cy="132.2326923329377" r="5"/></g>
  <g><title>2. re-mine the superoptimizer on forwarded code (43 rules): −11.2%</title><circle class="hit" cx="196.88888888888889" cy="132.61116398971643" r="14"/><circle class="dot" cx="196.88888888888889" cy="132.61116398971643" r="5"/></g>
  <g><title>3. heap headroom under -O: grow at 1/4 full instead of 1/2: −20.0%</title><circle class="hit" cx="267.33333333333337" cy="186.40301688011374" r="14"/><circle class="dot" cx="267.33333333333337" cy="186.40301688011374" r="5"/></g>
  <g><title>4. inline the allocation fast path under -O: −22.5%</title><circle class="hit" cx="337.77777777777777" cy="201.3962479373713" r="14"/><circle class="dot" cx="337.77777777777777" cy="201.3962479373713" r="5"/></g>
  <g><title>5. elide frame zeroing for slots written before any GC point: −23.9%</title><circle class="hit" cx="408.22222222222223" cy="210.42959555566875" r="14"/><circle class="dot" cx="408.22222222222223" cy="210.42959555566875" r="5"/></g>
  <g><title>6. superoptimizer: re-mine rewritten code until a fixed point; constants generalized under K &gt;= 0 side conditions: −24.0%</title><circle class="hit" cx="478.6666666666667" cy="210.45273426204116" r="14"/><circle class="dot" cx="478.6666666666667" cy="210.45273426204116" r="5"/></g>
  <g><title>7. forward frame-slot loads between GC points: −25.2%</title><circle class="hit" cx="549.1111111111111" cy="217.9353843820492" r="14"/><circle class="dot" cx="549.1111111111111" cy="217.9353843820492" r="5"/></g>
  <g><title>8. self tail calls become loops (frame reused): −27.3%</title><circle class="hit" cx="619.5555555555555" cy="230.93410922575458" r="14"/><circle class="dot" cx="619.5555555555555" cy="230.93410922575458" r="5"/></g>
  <g><title>9. inline array access; no shadow-stack frame where nothing can collect: −31.2%</title><circle class="hit" cx="690" cy="254.5305473561123" r="14"/><circle class="dot" cx="690" cy="254.5305473561123" r="5"/></g>
  <text class="value" x="702" y="258.53054735611227">−31.2%</text>
