name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit, golden and five-way semantic tests
        run: npm test
      - name: Re-prove every superoptimizer rule (SAT, independent RUP check, random testing)
        run: node superopt/verify.js --emit superopt-proofs
      - name: Upload the proofs (DIMACS + DRUP, checkable with drat-trim)
        uses: actions/upload-artifact@v4
        with:
          name: superopt-proofs
          path: superopt-proofs/
      - name: Self-hosted bootstrap (stage 1 = stage 2 = stage 3, plus parity on fuzz programs)
        run: node selfhost/bootstrap.js --programs 100
      - name: Benchmarks (every -O build must print exactly what the default build prints)
        run: node bench/bench.js --runs 1
      - name: Differential fuzzing (fresh seeds every run)
        run: node fuzz/fuzz.js --count 1000 --size 2 --seed $(( GITHUB_RUN_NUMBER * 1000 )) --quiet
      - name: Mutation testing of the fuzzer
        run: node fuzz/mutants.js --budget 400
      - name: Spec conformance
        run: node challenge/score.js --fuzz 200 -- node bin/lumen.js run

  lumen2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lumen2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lumen 2 tests (checker, interpreter, wasm back end, leak check, planted bugs)
        run: npm test
      - name: Lumen 2 differential fuzzing, four ways (fresh seeds every run)
        run: node test/fuzz.js 1000 $(( 100000 + GITHUB_RUN_NUMBER * 1000 ))
      - name: Lumen 2 certificates (IR types, ownership, DRUP proofs checked again)
        run: node bin/lumen2.js certify examples/refine.lm --out lumen2-certificates

  schur:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove S(4) = 44 with the Lumen SAT solver (checked by the independent RUP checker)
        run: node proofs/prove-schur.js 4 44 --out schur-proof
      - name: Upload the formulas and the refutation (DIMACS + DRUP, checkable with drat-trim)
        uses: actions/upload-artifact@v4
        with:
          name: schur-proof
          path: schur-proof/
